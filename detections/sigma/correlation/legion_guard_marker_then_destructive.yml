title: LEGION Guard Marker With Destructive Command on One Host
id: 1a03bfb8-7893-4730-9422-dd50c2dd91e8
status: experimental
description: |
    Temporal correlation for the multi-stage behaviour in the defense guide, section 4.2: on a
    single host, the LEGION platform-guard control marker (confirming LEGION executed there) AND a
    destructive command from the guard deny-list hunting rule occur within the same window.
    Pairing an LEGION-specific marker with the otherwise-generic destructive-command signal raises
    specificity. A destructive command on its own is routine administration and a known source of
    false positives; one that co-occurs with an active LEGION run on the same host is worth
    investigating. This assumes a normalized host field is present across both the application or
    audit logs and the process-creation logs; map it in your pipeline. It does not by itself prove
    LEGION issued the command — the guard blocks these patterns, so a hit means the destructive
    command ran outside or despite the guard near an LEGION run. Treat it as a high-priority lead.
references:
    - https://github.com/ShannonCodesAI/Legion-AI/blob/main/docs/defense-ko.md
    - https://github.com/ShannonCodesAI/Legion-AI/blob/main/docs/defense-en.md
    - https://github.com/ShannonCodesAI/Legion-AI
author: Legion-AI defense guide
date: 2026-10-05
tags:
