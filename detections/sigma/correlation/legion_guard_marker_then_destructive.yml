    - attack.t1485
correlation:
    type: temporal
    rules:
        - 3add497e-36cb-47c4-8993-df8f98585ef7
        - f510564f-2958-4dc8-a188-3300a2f6f5a7
    group-by:
        - host
    timespan: 30m
falsepositives:
    - Maintenance windows where an operator legitimately runs LEGION and, separately, performs
      destructive administration on the same host within the window. Confirm with change tickets.
level: high
